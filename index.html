<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Physics: Black Hole to Milky Way</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
  #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
  
  /* Browser Interaction Gate */
  #start-screen {
    position: absolute; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center;
    background: #000; color: #fff; cursor: pointer; transition: opacity 0.3s ease;
  }
  .start-text { font-size: 14px; letter-spacing: 0.5em; text-transform: uppercase; animation: pulse 2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

  /* Sequence Overlays */
  #overlay-black { position: absolute; inset: 0; background: #000; z-index: 50; opacity: 0; pointer-events: none; }
  #overlay-white { position: absolute; inset: 0; background: #fff; z-index: 49; opacity: 0; pointer-events: none; transition: opacity 0.1s; }
</style>
</head>
<body>

<div id="canvas-container"></div>
<div id="overlay-white"></div>
<div id="overlay-black"></div>
<div id="start-screen"><div class="start-text">Click to Initiate 3D Physics Sequence</div></div>

<!-- Three.js Core -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(function() {
  // --- 1. AUDIO SYNTHESIS ENGINE ---
  let audioCtx, masterGain;
  let droneOsc1, droneOsc2, filterNode;
  
  function initAudio() {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.setValueAtTime(1.0, audioCtx.currentTime);
    masterGain.connect(audioCtx.destination);
  }

  function triggerDistortionTear() {
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(40, now);
    osc.frequency.exponentialRampToValueAtTime(3000, now + 0.15);
    
    // WaveShaper for raw distortion tear[span_0](start_span)[span_0](end_span)
    const distNode = audioCtx.createWaveShaper();
    const curve = new Float32Array(44100);
    for (let i = 0; i < 44100; ++i) {
      let x = i * 2 / 44100 - 1;
      curve[i] = (53) * x * 20 * (Math.PI / 180) / (Math.PI + 50 * Math.abs(x));
    }
    distNode.curve = curve;

    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(1.0, now);
    gain.gain.setValueAtTime(0.0, now + 0.15);
    
    osc.connect(distNode).connect(gain).connect(masterGain);
    osc.start(now);
    osc.stop(now + 0.2);
  }

  function triggerBigBangAudio() {
    const now = audioCtx.currentTime;
    
    // Massive Sub Boom[span_1](start_span)[span_1](end_span)
    const bangOsc = audioCtx.createOscillator(); 
    bangOsc.type = 'sine'; 
    bangOsc.frequency.setValueAtTime(120, now); 
    bangOsc.frequency.exponentialRampToValueAtTime(10, now + 8.0);
    const bangGain = audioCtx.createGain(); 
    bangGain.gain.setValueAtTime(2.0, now); 
    bangGain.gain.exponentialRampToValueAtTime(0.01, now + 12.0);
    bangOsc.connect(bangGain).connect(masterGain); 
    bangOsc.start(now); 
    bangOsc.stop(now + 12.0);
    
    // Explosive White Noise Expansion[span_2](start_span)[span_2](end_span)
    const bufferSize = audioCtx.sampleRate * 2;
    const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    for (let i = 0; i < bufferSize; i++) noiseBuffer.getChannelData(0)[i] = (Math.random() * 2 - 1);
    const noiseNode = audioCtx.createBufferSource(); 
    noiseNode.buffer = noiseBuffer; 
    noiseNode.loop = true;
    const noiseFilter = audioCtx.createBiquadFilter(); 
    noiseFilter.type = 'lowpass'; 
    noiseFilter.frequency.setValueAtTime(8000, now); 
    noiseFilter.frequency.exponentialRampToValueAtTime(100, now + 6.0);
    const noiseGain = audioCtx.createGain(); 
    noiseGain.gain.setValueAtTime(1.2, now); 
    noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 8.0);
    noiseNode.connect(noiseFilter).connect(noiseGain).connect(masterGain); 
    noiseNode.start(now); 
    noiseNode.stop(now + 8.0);

    // Ethereal Galaxy Orbit Drone[span_3](start_span)[span_3](end_span)
    droneOsc1 = audioCtx.createOscillator(); droneOsc1.type = 'sawtooth'; droneOsc1.frequency.setValueAtTime(86.4, now + 2.0);
    droneOsc2 = audioCtx.createOscillator(); droneOsc2.type = 'sawtooth'; droneOsc2.frequency.setValueAtTime(87.2, now + 2.0);
    filterNode = audioCtx.createBiquadFilter(); filterNode.type = 'lowpass'; filterNode.frequency.setValueAtTime(400, now + 2.0);
    const galGain = audioCtx.createGain(); galGain.gain.setValueAtTime(0, now); galGain.gain.linearRampToValueAtTime(0.3, now + 6.0);
    droneOsc1.connect(filterNode); droneOsc2.connect(filterNode); filterNode.connect(galGain).connect(masterGain);
    droneOsc1.start(now); droneOsc2.start(now);
  }


  // --- 2. THREE.JS 3D PHYSICS SETUP ---
  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();
  
  // Camera setup
  const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 15, 35);
  camera.lookAt(0, 0, 0);

  // Renderer setup
  const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
  container.appendChild(renderer.domElement);

  // --- 3. PARTICLE SYSTEM & KINEMATICS ---
  const particleCount = 50000;
  const geometry = new THREE.BufferGeometry();
  const positions = new Float32Array(particleCount * 3);
  const velocities = new Float32Array(particleCount * 3);
  const colors = new Float32Array(particleCount * 3);

  // Physics Constants
  const G = 10.0; // Gravitational Constant scaling
  let centralMass = 50.0; // Initial Black Hole Mass

  for (let i = 0; i < particleCount; i++) {
    // Generate an initial accretion disk
    let r = 8.0 + Math.random() * 25.0;
    let theta = Math.random() * Math.PI * 2;
    // Flattened initial distribution
    let y = (Math.random() - 0.5) * (r * 0.1); 

    let px = r * Math.cos(theta);
    let pz = r * Math.sin(theta);

    positions[i*3] = px;
    positions[i*3+1] = y;
    positions[i*3+2] = pz;

    // Keplerian Orbital Velocity: v = sqrt(GM/r)
    let v = Math.sqrt((G * centralMass) / r);
    
    // Tangential vector
    velocities[i*3] = -Math.sin(theta) * v;
    velocities[i*3+1] = 0.0;
    velocities[i*3+2] = Math.cos(theta) * v;

    // Color mapping (Hot inner core, cooler outer)
    let heat = 1.0 - (r / 33.0);
    colors[i*3] = 1.0; 
    colors[i*3+1] = heat * 0.8 + 0.2;
    colors[i*3+2] = heat * 0.5;
  }

  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  // Custom Shader for Glowing Stars
  const particleMaterial = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0.0 } },
    vertexShader: `
      attribute vec3 color;
      varying vec3 vColor;
      void main() {
        vColor = color;
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = (18.0 / -mvPosition.z); // Perspective size scaling
        gl_Position = projectionMatrix * mvPosition;
      }
    `,
    fragmentShader: `
      varying vec3 vColor;
      void main() {
        // Create circular glowing particle
        float dist = length(gl_PointCoord - vec2(0.5));
        if (dist > 0.5) discard;
        float intensity = 1.0 - (dist * 2.0);
        gl_FragColor = vec4(vColor, intensity);
      }
    `,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    transparent: true
  });

  const particlesMesh = new THREE.Points(geometry, particleMaterial);
  scene.add(particlesMesh);

  // --- 4. GRAVITATIONAL LENSING (SPACE WRAP) POST-PROCESSING ---
  // To achieve the space-wrapping effect physically, we render the 3D scene to a target,
  // then apply a fragment shader that bends the UV coordinates toward the center.
  const renderTarget = new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight);
  const orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const orthoScene = new THREE.Scene();

  const lensMaterial = new THREE.ShaderMaterial({
    uniforms: {
      tDiffuse: { value: renderTarget.texture },
      uWarpAmount: { value: 0.0 }, // Dynamic physics warp
      uFlash: { value: 0.0 }
    },
    vertexShader: `void main() { gl_Position = vec4(position, 1.0); }`,
    fragmentShader: `
      uniform sampler2D tDiffuse;
      uniform float uWarpAmount;
      uniform float uFlash;
      varying vec2 vUv;
      void main() {
        vec2 uv = gl_FragCoord.xy / vec2(${window.innerWidth}.0, ${window.innerHeight}.0);
        
        // Gravitational Deflection Math: Bends light rays based on mass (uWarpAmount)
        vec2 center = vec2(0.5, 0.5);
        vec2 dir = uv - center;
        float dist = length(dir);
        
        // Lens equation: pull UVs outward to magnify center, pushing edges in
        vec2 warpedUv = uv + normalize(dir) * (uWarpAmount / (dist + 0.1));
        
        vec4 texColor = texture2D(tDiffuse, warpedUv);
        
        // Additive Big Bang Flash
        texColor += vec4(vec3(uFlash), 0.0);
        
        gl_FragColor = texColor;
      }
    `
  });
  const lensQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), lensMaterial);
  orthoScene.add(lensQuad);


  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderTarget.setSize(window.innerWidth, window.innerHeight);
  });


  // --- 5. CINEMATIC TIMELINE & PHYSICS LOOP ---
  let sequenceActive = false;
  let seqStartTime = 0;
  const clock = new THREE.Clock();
  
  // States
  const PHASE_WAITING = 0;
  const PHASE_COLLAPSE = 1;
  const PHASE_BLACKOUT = 2;
  const PHASE_BIGBANG = 3;
  const PHASE_GALAXY = 4;
  let currentPhase = PHASE_WAITING;

  // DOM Elements
  const startScreen = document.getElementById('start-screen');
  const overlayBlack = document.getElementById('overlay-black');
  const overlayWhite = document.getElementById('overlay-white');

  startScreen.addEventListener('click', () => {
    initAudio();
    startScreen.style.opacity = '0';
    setTimeout(() => startScreen.remove(), 300);
    
    // Audio Drone for collapse
    const buildOsc = audioCtx.createOscillator(); buildOsc.type = 'sawtooth';
    buildOsc.frequency.setValueAtTime(40, audioCtx.currentTime); 
    buildOsc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 3.0);
    const buildGain = audioCtx.createGain(); buildGain.gain.setValueAtTime(0, audioCtx.currentTime); 
    buildGain.gain.linearRampToValueAtTime(1.0, audioCtx.currentTime + 2.9); 
    buildGain.gain.setValueAtTime(0, audioCtx.currentTime + 3.0);
    buildOsc.connect(buildGain).connect(masterGain); buildOsc.start(); buildOsc.stop(audioCtx.currentTime + 3.0);

    sequenceActive = true;
    seqStartTime = clock.getElapsedTime();
    currentPhase = PHASE_COLLAPSE;
  });

  function updatePhysics(deltaTime, t) {
    const pos = geometry.attributes.position.array;
    const vel = velocities;
    
    // Phase 1: Black Hole Collapse
    if (currentPhase === PHASE_COLLAPSE) {
      // Exponentially increasing mass wraps space and overpowers orbital velocity
      centralMass = 50.0 + Math.pow(t, 4.0) * 200.0; 
      lensMaterial.uniforms.uWarpAmount.value = Math.pow(t / 3.0, 3.0) * 0.15; // Visual space warp

      for (let i = 0; i < particleCount; i++) {
        let ix = i*3, iy = i*3+1, iz = i*3+2;
        let x = pos[ix], y = pos[iy], z = pos[iz];
        let rSq = x*x + y*y + z*z;
        let r = Math.sqrt(rSq);

        // Newton's Law of Universal Gravitation
        let force = (G * centralMass) / Math.max(rSq, 0.1);
        
        // Acceleration vector towards center
        vel[ix] -= (x / r) * force * deltaTime;
        vel[iy] -= (y / r) * force * deltaTime;
        vel[iz] -= (z / r) * force * deltaTime;

        // Artificial drag simulating event horizon suction / loss of orbital energy
        let drag = 1.0 - (t * 0.2); 
        vel[ix] *= drag; vel[iy] *= drag; vel[iz] *= drag;

        pos[ix] += vel[ix] * deltaTime;
        pos[iy] += vel[iy] * deltaTime;
        pos[iz] += vel[iz] * deltaTime;
      }
    }
    
    // Phase 2: Absolutely Black
    else if (currentPhase === PHASE_BLACKOUT) {
      // Handled by UI/Render skip
    }
    
    // Phase 3: Big Bang (Inflationary Expansion)
    else if (currentPhase === PHASE_BIGBANG) {
      lensMaterial.uniforms.uWarpAmount.value = 0.0; // Reset warp
      
      // Explosion physics
      for (let i = 0; i < particleCount; i++) {
        let ix = i*3, iy = i*3+1, iz = i*3+2;
        
        // Move freely based on explosive velocity
        pos[ix] += vel[ix] * deltaTime;
        pos[iy] += vel[iy] * deltaTime;
        pos[iz] += vel[iz] * deltaTime;
      }
    }
    
    // Phase 4: Milky Way (Galactic Disk Formation)
    else if (currentPhase === PHASE_GALAXY) {
      let galTime = t - 4.2;
      centralMass = 800.0; // Stable supermassive black hole

      for (let i = 0; i < particleCount; i++) {
        let ix = i*3, iy = i*3+1, iz = i*3+2;
        let x = pos[ix], y = pos[iy], z = pos[iz];
        let rSq = x*x + z*z; // Cylinder radius for disk gravity
        let r = Math.sqrt(rSq);

        // 1. Collisional Cooling (Dampens vertical velocity to form a flat disk)
        vel[iy] -= (y * 5.0) * deltaTime; // Pull towards galactic plane
        vel[iy] *= 0.95; // Damping

        // 2. Centripetal Force & Angular Momentum Conservation
        let currentV = Math.sqrt(vel[ix]*vel[ix] + vel[iz]*vel[iz]);
        let targetV = Math.sqrt((G * centralMass) / Math.max(r, 0.1));
        
        // Gradually guide radial velocities into stable tangential Keplerian orbits
        let theta = Math.atan2(z, x);
        let targetVx = -Math.sin(theta) * targetV;
        let targetVz = Math.cos(theta) * targetV;

        // The older the galaxy gets, the more organized the rotation
        let structureFactor = Math.min(1.0, galTime * 0.1); 
        vel[ix] += (targetVx - vel[ix]) * structureFactor * deltaTime * 2.0;
        vel[iz] += (targetVz - vel[iz]) * structureFactor * deltaTime * 2.0;

        // 3. Spiral Density Wave (Forms the spiral arms)
        // Adds slight perturbations based on radius to create spiral bands
        let spiralArm = Math.sin(theta * 2.0 - r * 0.5 + galTime * 0.5);
        vel[ix] += (x/r) * spiralArm * 2.0 * deltaTime;
        vel[iz] += (z/r) * spiralArm * 2.0 * deltaTime;

        // Integrate
        pos[ix] += vel[ix] * deltaTime;
        pos[iy] += vel[iy] * deltaTime;
        pos[iz] += vel[iz] * deltaTime;
      }
    }
    
    geometry.attributes.position.needsUpdate = true;
  }

  function animate() {
    requestAnimationFrame(animate);
    
    let deltaTime = clock.getDelta();
    let t = clock.getElapsedTime();

    if(sequenceActive) {
        let seqT = t - seqStartTime;
        
        // TIMELINE MANAGER
        if (seqT < 3.0) {
            currentPhase = PHASE_COLLAPSE;
            // Slowly rotate camera for dramatic effect
            camera.position.x = Math.sin(seqT * 0.5) * 35;
            camera.position.z = Math.cos(seqT * 0.5) * 35;
            camera.lookAt(0,0,0);
            
        } else if (seqT < 3.1) {
            if (currentPhase !== PHASE_BLACKOUT) {
                currentPhase = PHASE_BLACKOUT;
                triggerDistortionTear();
                overlayBlack.style.opacity = '1';
                particlesMesh.visible = false;
            }
            
        } else if (seqT < 4.2) {
            // Stay absolutely black and silent
            
        } else if (seqT < 4.3) {
            if (currentPhase !== PHASE_BIGBANG) {
                currentPhase = PHASE_BIGBANG;
                triggerBigBangAudio();
                overlayBlack.style.opacity = '0';
                overlayWhite.style.opacity = '1'; // Massive Flash
                particlesMesh.visible = true;
                
                // Initialize Big Bang Inflationary Velocities
                const pos = geometry.attributes.position.array;
                const vel = velocities;
                for (let i = 0; i < particleCount; i++) {
                    pos[i*3] = 0; pos[i*3+1] = 0; pos[i*3+2] = 0; // Compress to singularity
                    
                    // Spherical random distribution
                    let u = Math.random();
                    let v = Math.random();
                    let theta = u * 2.0 * Math.PI;
                    let phi = Math.acos(2.0 * v - 1.0);
                    let speed = 40.0 + Math.random() * 80.0; // Massive outward speed
                    
                    vel[i*3] = speed * Math.sin(phi) * Math.cos(theta);
                    vel[i*3+1] = (speed * Math.sin(phi) * Math.sin(theta)) * 0.2; // Flattened burst
                    vel[i*3+2] = speed * Math.cos(phi);
                }
            }
            
        } else {
            currentPhase = PHASE_GALAXY;
            let galTime = seqT - 4.2;
            
            // Fade out the flash
            overlayWhite.style.opacity = Math.max(0.0, 1.0 - galTime / 4.0).toString();
            
            // Slow orbital camera movement around the forming galaxy
            camera.position.x = Math.sin(galTime * 0.1) * 45;
            camera.position.y = 15 + Math.sin(galTime * 0.05) * 10; // Bobbing
            camera.position.z = Math.cos(galTime * 0.1) * 45;
            camera.lookAt(0,0,0);
        }

        updatePhysics(Math.min(deltaTime, 0.1), seqT); // Cap delta time to prevent physics explosion
    }

    // --- RENDER PASSES ---
    // 1. Render 3D scene to texture
    renderer.setRenderTarget(renderTarget);
    renderer.clear();
    if (currentPhase !== PHASE_BLACKOUT) {
        renderer.render(scene, camera);
    }
    
    // 2. Render textured quad to screen (applying gravitational lensing)
    renderer.setRenderTarget(null);
    renderer.clear();
    renderer.render(orthoScene, orthoCamera);
  }

  animate();
})();
</script>
</body>
</html>
